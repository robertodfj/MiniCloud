spring.application.name=MiniCloud

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/minicloud?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Email
spring.mail.host=smtp.example.com
spring.mail.port=465
spring.mail.username=example@example.com
spring.mail.password=examplepassword